<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Polka Librium">
<meta name="application-name" content="Polka Librium">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><text x='50' y='74' font-family='Arial Black, Arial, sans-serif' font-size='80' font-weight='900' text-anchor='middle' fill='%231d1d1f'>P</text><rect x='30' y='84' width='40' height='7' fill='%232ea043'/></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><text x='50' y='74' font-family='Arial Black, Arial, sans-serif' font-size='80' font-weight='900' text-anchor='middle' fill='%231d1d1f'>P</text><rect x='30' y='84' width='40' height='7' fill='%232ea043'/></svg>">
<title>Polka Librium — Учет прочитанных книг</title>
<style>
/* Базовые переменные */
:root {
  --panel: #ffffff; --panel-2: #fafafa;
  --border: #d8d8dd; --text: #1d1d1f; --muted: #6e6e73;
  --danger: #ff3b30;
  --gold: #d4a05a; --star: #f0a000;
  --shadow: 0 4px 14px rgba(0,0,0,0.08);
  --accent: #1a7f37; --accent-hover: #14802c; /* default green */
  --bg: linear-gradient(135deg, #f2fcf5 0%, #f5f5f7 100%); /* default bg */
}
body.dark {
  --panel: #1e2126; --panel-2: #23262c;
  --border: #383c44; --text: #eef0f3; --muted: #9aa0a8;
  --danger: #ff453a;
  --gold: #e0b070; --star: #f0a000;
  --shadow: 0 4px 18px rgba(0,0,0,0.4);
  --accent: #34c759; --accent-hover: #2fb350;
  --bg: linear-gradient(135deg, #09170e 0%, #14161a 100%);
}

/* Настраиваемые цвета кнопок (Accent) */
body[data-accent="green"] { --accent: #1a7f37; --accent-hover: #14802c; }
body[data-accent="blue"] { --accent: #0071e3; --accent-hover: #0077ed; }
body[data-accent="pink"] { --accent: #c2185b; --accent-hover: #ad1457; }
body[data-accent="purple"] { --accent: #6f42c1; --accent-hover: #5a369e; }

body.dark[data-accent="green"] { --accent: #34c759; --accent-hover: #2fb350; }
body.dark[data-accent="blue"] { --accent: #0a84ff; --accent-hover: #3395ff; }
body.dark[data-accent="pink"] { --accent: #ff375f; --accent-hover: #ff506e; }
body.dark[data-accent="purple"] { --accent: #bf5af2; --accent-hover: #c97bf5; }

/* Настраиваемые фоны (Background) */
body[data-bg="green"] { --bg: linear-gradient(135deg, #f2fcf5 0%, #f5f5f7 100%); }
body[data-bg="gray"] { --bg: linear-gradient(135deg, #e9ecef 0%, #f8f9fa 100%); }
body[data-bg="white"] { --bg: #ffffff; }

body.dark[data-bg="green"] { --bg: linear-gradient(135deg, #09170e 0%, #14161a 100%); }
body.dark[data-bg="gray"] { --bg: linear-gradient(135deg, #1a1c21 0%, #24272e 100%); }
body.dark[data-bg="white"] { --bg: #14161a; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); background-attachment: fixed; color: var(--text);
  font-size: 16px; line-height: 1.45;
  transition: background 0.3s, color 0.3s;
  min-height: 100%; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

/* Обертка для выравнивания контента */
.layout-wrapper { display: flex; flex-direction: column; max-width: 1100px; margin: 0 auto; width: 100%; padding: 0 18px; }
.app-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 16px 0 10px; width: 100%; }
.logo { display: flex; flex-direction: column; gap: 3px; }
.logo-main {
  display: flex; align-items: baseline;
  font-family: 'Arial Black', 'Helvetica', Arial, sans-serif;
  font-size: 26px; font-weight: 900; letter-spacing: 1.5px;
  line-height: 1; color: var(--text); text-transform: uppercase;
}
.logo-p { position: relative; display: inline-block; padding-bottom: 7px; margin: 0 1px; }
.logo-p::after { content: ''; position: absolute; left: 6%; right: 22%; bottom: 0; height: 4px; background: var(--accent); border-radius: 2px; }
.logo-tagline { font-size: 11px; color: var(--muted); letter-spacing: 0.4px; font-weight: 500; }

/* Правая колонка (Часы и Статистика) */
.header-right { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; max-width: 300px; }
.clock {
  background: var(--panel); border: 2px solid var(--border);
  border-radius: 10px; padding: 6px 8px 6px 12px;
  font-family: 'SF Mono', Consolas, monospace; color: var(--text);
  z-index: 30; box-shadow: var(--shadow); line-height: 1.25;
  display: flex; align-items: center; gap: 8px;
}
.clock-info { text-align: right; user-select: none; pointer-events: none; }
.clock .clock-date { font-size: 11px; color: var(--muted); font-weight: 600; }
.clock .clock-time { font-size: 15px; font-weight: 700; }
.clock-theme {
  width: 34px; height: 34px; padding: 0; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  cursor: pointer; font-size: 16px; font-family: inherit;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s;
}
.clock-theme:hover { background: var(--panel); border-color: var(--accent); }

.header-stats {
  background: var(--panel); border: 2px solid var(--border); border-radius: 10px;
  padding: 8px 12px; font-size: 12px; box-shadow: var(--shadow);
  width: 100%; text-align: right;
}
.header-stats .hs-total { font-weight: 700; margin-bottom: 4px; color: var(--accent); font-size: 13px; }
.header-stats .hs-years { color: var(--muted); font-family: 'SF Mono', Consolas, monospace; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.header-stats .hs-years span { background: var(--panel-2); padding: 1px 4px; border-radius: 4px; border: 1px solid var(--border); }

/* Иллюстрация полок */
.hero-shelf {
  width: 100%; max-width: 800px; height: 140px; margin: 10px auto 20px;
  display: flex; justify-content: center; align-items: flex-end;
  overflow: hidden; position: relative;
}
.hero-shelf svg {
  width: 100%; height: 100%;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
}

/* Основной контент */
.app-main { max-width: 800px; width: 100%; margin-right: auto; margin-left: 0; padding-bottom: 110px; }

.top-tabs { display: flex; gap: 8px; margin-bottom: 16px; background: var(--panel); padding: 6px; border-radius: 12px; border: 2px solid var(--border); overflow-x: auto; }
.tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--muted); font-family: inherit; font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.tab-btn.active { background: var(--accent); color: white; }
.tab-btn:not(.active):hover { color: var(--text); background: var(--panel-2); }

.sub-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.sub-tab-btn { padding: 8px 16px; border: 2px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: 20px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
.sub-tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

.search-bar { display: flex; gap: 8px; margin-bottom: 12px; }
.search-bar input {
  flex: 1; font-family: inherit; font-size: 15px;
  padding: 12px 16px; border: 2px solid var(--border); border-radius: 12px;
  background: var(--panel); color: var(--text); outline: none; transition: border-color 0.15s;
}
.search-bar input:focus { border-color: var(--accent); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filters select {
  padding: 8px 12px; border-radius: 10px; border: 2px solid var(--border);
  background: var(--panel); color: var(--text); font-family: inherit; font-size: 14px;
  outline: none; cursor: pointer;
}
.count-label { font-size: 13px; color: var(--muted); font-weight: 600; margin-bottom: 10px; display: block; }

/* Заголовки групп */
.year-header { font-size: 26px; font-weight: 900; color: var(--text); margin: 24px 0 10px; padding-bottom: 8px; border-bottom: 3px solid var(--accent); position: sticky; top: 0; background: var(--bg); z-index: 20; letter-spacing: 1px; display: flex; align-items: baseline; gap: 10px; }
.year-header span { font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.year-header:first-child { margin-top: 0; }
.month-header { font-size: 16px; font-weight: 700; color: var(--accent); margin: 16px 0 8px; text-transform: capitalize; display: flex; align-items: center; gap: 10px; }
.month-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.month-header span { font-size: 12px; color: var(--muted); font-weight: 600; }

/* Стили карточек книг */
.node-list { display: flex; flex-direction: column; gap: 6px; }
.node {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--panel); border: 2px solid var(--border);
  border-radius: 12px; cursor: pointer; transition: all 0.15s;
  position: relative; user-select: none;
}
.node:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
.node:active { transform: scale(0.99); }
.node-index { font-size: 14px; font-weight: 800; color: var(--muted); font-family: 'SF Mono', Consolas, monospace; min-width: 24px; text-align: right; }
.node-cover { width: 40px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--panel-2); border: 1px solid var(--border); flex-shrink: 0; }
.node-body { flex: 1; min-width: 0; }
.node-name { font-weight: 700; font-size: 15px; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node-author { font-size: 13px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node-meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.node-meta .stars { color: var(--star); letter-spacing: 1px; font-size: 14px; }
.fav-icon { color: var(--star); font-size: 16px; margin-left: auto; }

/* Золотой градиент для избранных книг */
.node.fav-book {
  background: linear-gradient(135deg, var(--panel) 0%, rgba(240, 160, 0, 0.12) 100%);
  border-color: rgba(240, 160, 0, 0.5);
}
body.dark .node.fav-book {
  background: linear-gradient(135deg, var(--panel) 0%, rgba(240, 160, 0, 0.2) 100%);
  border-color: rgba(240, 160, 0, 0.6);
}

/* Авторы */
.author-card { display: flex; align-items: center; justify-content: space-between; padding: 14px; background: var(--panel); border: 2px solid var(--border); border-radius: 12px; margin-bottom: 8px; }
.author-name { font-weight: 700; font-size: 15px; }
.author-fav-btn { background: transparent; border: none; font-size: 24px; cursor: pointer; color: #d0d0d5; transition: 0.2s; }
.author-fav-btn.on { color: var(--star); }

/* Аналитика */
.analytics-view { display: flex; flex-direction: column; gap: 20px; }
.chart-block { background: var(--panel); border: 2px solid var(--border); border-radius: 12px; padding: 18px; margin-top: 10px; }
.chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
.chart-block h3 { font-size: 16px; font-weight: 700; color: var(--text); margin: 0; }
.year-select { padding: 8px 12px; border-radius: 8px; border: 2px solid var(--border); background: var(--panel-2); color: var(--text); font-family: inherit; font-size: 14px; font-weight: 600; outline: none; cursor: pointer; }
.bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 160px; padding-top: 35px; padding-bottom: 24px; position: relative; border-bottom: 2px solid var(--border); }
.bar-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; position: relative; cursor: pointer; }
.bar-wrapper:hover .bar { background: var(--accent-hover); filter: brightness(1.2); }
.bar { width: 100%; max-width: 40px; background: var(--accent); border-radius: 6px 6px 0 0; transition: height 0.4s ease, background 0.2s; min-height: 4px; position: relative; }
.bar-val { position: absolute; top: -22px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--text); }
.bar-label { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; }

/* Модальные окна */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  display: none; align-items: flex-end; justify-content: center; z-index: 100; padding: 0;
}
.modal-overlay.open { display: flex; }
@media (min-width: 600px) { .modal-overlay { align-items: center; padding: 20px; } }
.modal {
  background: var(--panel); width: 100%; max-width: 560px; max-height: 92vh;
  display: flex; flex-direction: column; border-radius: 18px 18px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px); overflow: hidden;
  box-shadow: 0 -10px 40px rgba(0,0,0,0.3); animation: slideUp 0.25s ease-out;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@media (min-width: 600px) { .modal { border-radius: 18px; animation: fadeIn 0.2s; } }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.modal-header { padding: 18px 22px 14px; border-bottom: 1px solid var(--border); font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.modal-header button { background: transparent; border: none; cursor: pointer; font-size: 22px; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
.modal-header button:hover { background: var(--panel-2); color: var(--text); }
.modal-body { padding: 20px 22px; overflow-y: auto; flex: 1; }
.modal-footer { padding: 14px 22px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-shrink: 0; }

.field-group { margin-bottom: 16px; }
.field-group > label { display: block; font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
input[type="text"], input[type="number"], textarea, select {
  font-family: inherit; font-size: 16px; padding: 12px 14px; width: 100%;
  border: 2px solid var(--border); border-radius: 10px; background: var(--panel-2);
  color: var(--text); outline: none; transition: border-color 0.15s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 80px; }

.rating-container { display: flex; align-items: center; gap: 16px; background: var(--panel-2); padding: 12px; border-radius: 10px; border: 2px solid var(--border); }
.rating-container input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; height: 8px; }
.rating-display { font-size: 20px; font-weight: 800; color: var(--star); min-width: 50px; text-align: right; font-family: 'SF Mono', Consolas, monospace; }

.cover-area { display: flex; gap: 12px; align-items: flex-start; }
.cover-preview { width: 80px; height: 110px; border-radius: 8px; border: 2px solid var(--border); background: var(--panel-2); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 30px; flex-shrink: 0; overflow: hidden; }
.cover-preview img { width: 100%; height: 100%; object-fit: cover; }
.cover-controls { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.cover-controls input[type="text"] { font-size: 14px; padding: 8px 10px; }
.cover-controls .row { display: flex; gap: 6px; }
.cover-controls button { padding: 8px 12px; font-size: 13px; }

/* Цветовые настройки */
.color-picker { display: flex; gap: 12px; flex-wrap: wrap; }
.color-swatch { width: 44px; height: 44px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; transition: 0.2s; box-shadow: inset 0 0 0 2px var(--panel); }
.color-swatch.active { border-color: var(--text); transform: scale(1.1); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 13px 22px; border-radius: 12px; border: 2px solid var(--border); background: var(--panel); color: var(--text); font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform 0.1s, background 0.15s, border-color 0.15s; }
.btn:hover { background: var(--panel-2); border-color: var(--accent); }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: rgba(255,59,48,0.1); border-color: var(--danger); }

.actions-bar { position: fixed; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; justify-content: center; padding: 0 18px; pointer-events: none; z-index: 40; }
.actions-bar .btn { pointer-events: auto; box-shadow: var(--shadow); border-radius: 50px; padding: 14px 24px; font-size: 16px; }

.app-footer { text-align: left; padding: 24px 0; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 20px; width: 100%; max-width: 800px; }
.footer-tools { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
.storage-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--border); font-family: 'SF Mono', Consolas, monospace; font-size: 11px; color: var(--muted); margin-top: 10px; }

.empty-state { text-align: left; padding: 40px 4px; color: var(--muted); }
.empty-state .big-icon { font-size: 42px; margin-bottom: 10px; }
.empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 14px; }

.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,.95); color: #fff; padding: 12px 22px; border-radius: 24px; font-size: 14px; z-index: 300; opacity: 0; transition: opacity .3s; pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.4); text-align: center; max-width: 90%; }
.toast.show { opacity: 1; }

@media (max-width: 800px) {
  .app-header { flex-direction: column; align-items: stretch; }
  .header-right { max-width: 100%; align-items: stretch; margin-top: 10px; }
  .clock { align-self: flex-end; }
  .header-stats { display: block; text-align: left; }
  .header-stats .hs-years { justify-content: flex-start; }
  .logo-main { font-size: 22px; }
  .app-main { max-width: 100%; }
  .hero-shelf { height: 100px; margin: 5px auto 15px; }
}
</style>
</head>
<body>

<div class="layout-wrapper">
  <header class="app-header">
    <div class="logo">
      <div class="logo-main"><span class="logo-p">P</span><span>OLKA LIBRIUM</span></div>
      <div class="logo-tagline">Учет прочитанных книг.</div>
    </div>
    <div class="header-right">
      <div class="clock" id="clock">
        <div class="clock-info">
          <div class="clock-date">—</div>
          <div class="clock-time">—</div>
        </div>
        <button class="clock-theme" id="themeToggle" title="Сменить тему">🌙</button>
        <button class="clock-theme" onclick="openThemeSettings()" title="Настройки цвета">🎨</button>
      </div>
      <div class="header-stats" id="headerStats"></div>
    </div>
  </header>

  <!-- Иллюстрация книжных полок -->
  <div class="hero-shelf">
    <svg viewBox="0 0 600 150" preserveAspectRatio="xMidYMax meet">
      <!-- Полка -->
      <rect x="20" y="140" width="560" height="8" rx="4" fill="var(--border)" />
      
      <!-- Книги на полке (отрисовка с использованием переменных цветов) -->
      <!-- Группа 1 -->
      <rect x="50" y="60" width="20" height="80" rx="2" fill="var(--accent)" opacity="0.8" />
      <rect x="72" y="70" width="15" height="70" rx="2" fill="var(--gold)" opacity="0.9" />
      <rect x="89" y="50" width="25" height="90" rx="2" fill="var(--muted)" opacity="0.6" />
      <rect x="116" y="80" width="18" height="60" rx="2" fill="var(--accent-hover)" opacity="0.7" />
      
      <!-- Наклоненная книга -->
      <g transform="translate(140, 140) rotate(-15)">
        <rect x="0" y="-90" width="22" height="90" rx="2" fill="var(--panel)" stroke="var(--border)" stroke-width="2" />
      </g>
      
      <!-- Группа 2 -->
      <rect x="180" y="55" width="22" height="85" rx="2" fill="var(--accent)" opacity="0.9" />
      <rect x="204" y="75" width="16" height="65" rx="2" fill="var(--muted)" opacity="0.5" />
      <rect x="222" y="40" width="28" height="100" rx="2" fill="var(--gold)" opacity="0.8" />
      <rect x="252" y="65" width="20" height="75" rx="2" fill="var(--accent-hover)" opacity="0.6" />
      
      <!-- Цветок / Растение -->
      <g transform="translate(285, 80)">
         <path d="M 10 60 Q 10 30 20 10 Q 30 30 10 60" fill="var(--accent)" opacity="0.7"/>
         <path d="M 10 60 Q 0 30 -10 15 Q 20 30 10 60" fill="var(--accent)" opacity="0.5"/>
         <rect x="5" y="50" width="10" height="20" rx="2" fill="var(--muted)" />
      </g>

<script>
(function () {
'use strict';

const STORAGE_KEY = 'polka_librium_books_v1';
const THEME_KEY = 'polka_librium_theme';
const FAV_AUTHORS_KEY = 'polka_librium_fav_authors';
const THEME_SETTINGS_KEY = 'polka_theme_settings';

let books = [];
let favAuthors = [];
let themeSettings = { accent: 'green', bg: 'green' };
let editingBookId = null;
let tempRating = 0;
let tempCover = '';
let currentView = 'list';
let currentFavTab = 'books';

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(books)); updateStorageBadge(); } catch(e) { alert('Хранилище заполнено. Удалите лишние фото.'); } }
function saveFavAuthors() { try { localStorage.setItem(FAV_AUTHORS_KEY, JSON.stringify(favAuthors)); } catch(e) {} }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3500); }

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) books = JSON.parse(raw);
    if (!Array.isArray(books)) books = [];
    books.forEach(b => { if (b.favorite === undefined) b.favorite = false; if (!b.cover) b.cover = ''; });
  } catch(e) { books = []; }
  try {
    const rawFav = localStorage.getItem(FAV_AUTHORS_KEY);
    if (rawFav) favAuthors = JSON.parse(rawFav);
    if (!Array.isArray(favAuthors)) favAuthors = [];
  } catch(e) { favAuthors = []; }
  try {
    const rawSettings = localStorage.getItem(THEME_SETTINGS_KEY);
    if (rawSettings) themeSettings = JSON.parse(rawSettings);
  } catch(e) {}
}

function updateStorageBadge() {
  const el = document.getElementById('storageBadge');
  if (!el) return;
  try {
    const bytes = (localStorage.getItem(STORAGE_KEY) || '').length * 2;
    const mb = (bytes / (1024 * 1024)).toFixed(2);
    el.innerHTML = `💾 Хранилище: <b>${mb} МБ</b> из ~5 МБ`;
  } catch(e) {}
}

function applyTheme(theme) {
  if (theme === 'dark') document.body.classList.add('dark');
  else document.body.classList.remove('dark');
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
}

function applyThemeSettings() {
  document.body.setAttribute('data-accent', themeSettings.accent);
  document.body.setAttribute('data-bg', themeSettings.bg);
}

document.getElementById('themeToggle').onclick = () => {
  const next = document.body.classList.contains('dark') ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
};

// --- НАСТРОЙКИ ЦВЕТА ---
window.openThemeSettings = function() {
  const acc = themeSettings.accent;
  const bg = themeSettings.bg;
  
  const html = `
    <div class="modal-overlay open" id="themeSettingsModal" onclick="if(event.target===this) this.remove()">
      <div class="modal">
        <div class="modal-header"><span>🎨 Настройки внешнего вида</span><button onclick="document.getElementById('themeSettingsModal').remove()">✕</button></div>
        <div class="modal-body">
          <div class="field-group">
            <label>Цвет кнопок и акцентов</label>
            <div class="color-picker">
              <button class="color-swatch ${acc==='green'?'active':''}" style="background:#1a7f37" onclick="setThemeAccent('green')"></button>
              <button class="color-swatch ${acc==='blue'?'active':''}" style="background:#0071e3" onclick="setThemeAccent('blue')"></button>
              <button class="color-swatch ${acc==='pink'?'active':''}" style="background:#c2185b" onclick="setThemeAccent('pink')"></button>
              <button class="color-swatch ${acc==='purple'?'active':''}" style="background:#6f42c1" onclick="setThemeAccent('purple')"></button>
            </div>
          </div>
          <div class="field-group">
            <label>Фон приложения</label>
            <div class="color-picker">
              <button class="color-swatch ${bg==='green'?'active':''}" style="background:linear-gradient(135deg,#f2fcf5,#f5f5f7)" onclick="setThemeBg('green')"></button>
              <button class="color-swatch ${bg==='gray'?'active':''}" style="background:linear-gradient(135deg,#e9ecef,#f8f9fa)" onclick="setThemeBg('gray')"></button>
              <button class="color-swatch ${bg==='white'?'active':''}" style="background:#ffffff" onclick="setThemeBg('white')"></button>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn primary" onclick="document.getElementById('themeSettingsModal').remove()">Готово</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
};

window.setThemeAccent = function(color) {
  themeSettings.accent = color;
  localStorage.setItem(THEME_SETTINGS_KEY, JSON.stringify(themeSettings));
  applyThemeSettings();
  document.getElementById('themeSettingsModal').remove();
  openThemeSettings();
};

window.setThemeBg = function(color) {
  themeSettings.bg = color;
  localStorage.setItem(THEME_SETTINGS_KEY, JSON.stringify(themeSettings));
  applyThemeSettings();
  document.getElementById('themeSettingsModal').remove();
  openThemeSettings();
};

function updateClock() {
  const now = new Date();
  document.querySelector('.clock-date').textContent = now.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric' });
  document.querySelector('.clock-time').textContent = now.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
}
setInterval(updateClock, 10000);

// --- СТАТИСТИКА В ШАПКЕ ---
function updateHeaderStats() {
  const el = document.getElementById('headerStats');
  if (!el) return;
  
  const yearCounts = {};
  books.forEach(b => {
    const d = parseDateInfo(b.readDate);
    if (d.year) yearCounts[d.year] = (yearCounts[d.year] || 0) + 1;
  });
  
  const years = Object.keys(yearCounts).map(Number).sort((a,b)=>b-a); 
  
  if (books.length === 0) {
    el.innerHTML = '';
    return;
  }

  let yearsHtml = years.map(y => `<span>${y}: ${yearCounts[y]}</span>`).join('');
  
  el.innerHTML = `
    <div class="hs-total">Всего: ${books.length}</div>
    <div class="hs-years">${yearsHtml}</div>
  `;
}

// --- ПАРСИНГ ДАТ ---
const MONTHS = {'январь':1,'января':1,'февраль':2,'февраля':2,'март':3,'марта':3,'апрель':4,'апреля':4,'май':5,'мая':5,'июнь':6,'июня':6,'июль':7,'июля':7,'август':8,'августа':8,'сентябрь':9,'сентября':9,'октябрь':10,'октября':10,'ноябрь':11,'ноября':11,'декабрь':12,'декабря':12};
const MONTH_NAMES = {1:'Январь', 2:'Февраль', 3:'Март', 4:'Апрель', 5:'Май', 6:'Июнь', 7:'Июль', 8:'Август', 9:'Сентябрь', 10:'Октябрь', 11:'Ноябрь', 12:'Декабрь'};

function parseDateInfo(str) {
  if (!str) return { year: 0, month: 0, sortVal: 0 };
  const s = String(str).toLowerCase().trim();
  let m = 0, y = 0;
  
  for (const k in MONTHS) { 
    if (s.includes(k)) { m = MONTHS[k]; break; } 
  }
  
  const ym = s.match(/\b(19|20)\d{2}\b/);
  if (ym) y = parseInt(ym[0], 10);
  
  let sortMonth = m || 6;
  return { year: y, month: m, sortVal: y * 10000 + sortMonth * 100 + 15 };
}

// --- ОТРИСОВКА ЗВЕЗД ---
function renderStarsHtml(rating) {
  if (!rating) return '';
  let full = Math.floor(rating);
  let half = rating % 1 !== 0;
  let str = '★'.repeat(full) + (half ? '½' : '');
  return `<span class="stars">${str}</span>`;
}

// --- СПИСОК КНИГ ---
function renderList() {
  const list = document.getElementById('booksList');
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const fr = document.getElementById('filterRating').value;
  const sort = document.getElementById('sortOrder').value;

  let filtered = books.filter(b => {
    if (q && !(b.title||'').toLowerCase().includes(q) && !(b.author||'').toLowerCase().includes(q)) return false;
    if (fr === 'unrated' && b.rating > 0) return false;
    if (fr !== 'all' && fr !== 'unrated' && b.rating < parseFloat(fr)) return false;
    return true;
  });

  filtered.sort((a, b) => {
    const da = parseDateInfo(a.readDate), db = parseDateInfo(b.readDate);
    if (sort === 'date-desc') return db.sortVal - da.sortVal;
    if (sort === 'date-asc') return da.sortVal - db.sortVal;
    if (sort === 'rating-desc') return (b.rating||0) - (a.rating||0);
    if (sort === 'rating-asc') return (a.rating||0) - (b.rating||0);
    if (sort === 'title-asc') return (a.title||'').localeCompare(b.title||'');
    return 0;
  });

  document.getElementById('countLabel').textContent = `Найдено книг: ${filtered.length}`;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="big-icon">📚</div><h3>Ничего не найдено</h3><p>Измените фильтры или добавьте книгу.</p></div>';
    return;
  }

  let html = '';
  let currentYear = null;
  let currentMonth = null;
  let index = 1;

  const isDateSort = sort.includes('date');
  const yearCounts = {};
  const monthCounts = {};
  
  filtered.forEach(b => {
    const d = parseDateInfo(b.readDate);
    if (d.year) {
      yearCounts[d.year] = (yearCounts[d.year] || 0) + 1;
      if (d.month) {
        const key = `${d.year}-${d.month}`;
        monthCounts[key] = (monthCounts[key] || 0) + 1;
      }
    }
  });

  filtered.forEach(b => {
    const d = parseDateInfo(b.readDate);
    
    if (isDateSort && d.year) {
      if (d.year !== currentYear) {
        currentYear = d.year;
        currentMonth = null; 
        html += `<div class="year-header">${d.year} <span>(${yearCounts[d.year]} книг)</span></div>`;
      }
      if (d.month && d.month !== currentMonth) {
        currentMonth = d.month;
        html += `<div class="month-header">${MONTH_NAMES[d.month]} <span>${monthCounts[`${d.year}-${d.month}`]} шт.</span></div>`;
      }
    }

    const favIcon = b.favorite ? `<span class="fav-icon">★</span>` : '';
    const coverHtml = b.cover ? `<img src="${escapeHtml(b.cover)}" class="node-cover" onerror="this.style.display='none'">` : '';
    const nodeClass = b.favorite ? 'node fav-book' : 'node';
    
    html += `
      <div class="${nodeClass}" onclick="openBookModal('${b.id}')">
        <div class="node-index">${index++}.</div>
        ${coverHtml}
        <div class="node-body">
          <div class="node-name" style="padding-right: 20px;">${escapeHtml(b.title)} ${favIcon}</div>
          <div class="node-author">${escapeHtml(b.author || 'Автор не указан')}</div>
          <div class="node-meta">
            ${renderStarsHtml(b.rating)}
            ${b.readDate ? `<span>📅 ${escapeHtml(b.readDate)}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  });

  list.innerHTML = html;
}

document.getElementById('searchInput').addEventListener('input', renderList);
document.getElementById('filterRating').addEventListener('change', renderList);
document.getElementById('sortOrder').addEventListener('change', renderList);

// --- ИЗБРАННОЕ ---
window.switchFavTab = function(tab) {
  currentFavTab = tab;
  document.getElementById('subTabBooks').classList.toggle('active', tab === 'books');
  document.getElementById('subTabAuthors').classList.toggle('active', tab === 'authors');
  document.getElementById('favBooksList').style.display = tab === 'books' ? 'flex' : 'none';
  document.getElementById('favAuthorsList').style.display = tab === 'authors' ? 'block' : 'none';
  
  if (tab === 'books') renderFavBooks();
  else renderFavAuthors();
}

function renderFavBooks() {
  const list = document.getElementById('favBooksList');
  const favs = books.filter(b => b.favorite);
  
  if (favs.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="big-icon">⭐</div><h3>Нет избранных книг</h3></div>';
    return;
  }
  
  let html = '';
  let index = 1;
  favs.forEach(b => {
    const coverHtml = b.cover ? `<img src="${escapeHtml(b.cover)}" class="node-cover" onerror="this.style.display='none'">` : '';
    html += `
      <div class="node fav-book" onclick="openBookModal('${b.id}')">
        <div class="node-index">${index++}.</div>
        ${coverHtml}
        <div class="node-body">
          <div class="node-name">${escapeHtml(b.title)}</div>
          <div class="node-author">${escapeHtml(b.author || 'Автор не указан')}</div>
          <div class="node-meta">
            ${renderStarsHtml(b.rating)}
            ${b.readDate ? `<span>📅 ${escapeHtml(b.readDate)}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  });
  list.innerHTML = html;
}

function renderFavAuthors() {
  const container = document.getElementById('favAuthorsList');
  const validFavs = favAuthors.filter(author => books.some(b => (b.author||'').includes(author)));
  
  let html = '<div style="margin-bottom:12px;"><button class="btn primary" style="width:100%;" onclick="openAuthorSelect()">➕ Добавить автора в избранное</button></div>';

  if (validFavs.length === 0) {
    html += '<div class="empty-state"><div class="big-icon">✍️</div><h3>Нет избранных авторов</h3><p>Нажмите кнопку выше, чтобы добавить.</p></div>';
    container.innerHTML = html;
    return;
  }

  validFavs.forEach(author => {
    html += `
      <div class="author-card">
        <div class="author-name">${escapeHtml(author)}</div>
        <button class="author-fav-btn on" onclick="toggleFavAuthor('${escapeHtml(author).replace(/'/g, "\\'")}')">★</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

window.openAuthorSelect = function() {
  const allAuthors = [...new Set(books.map(b => (b.author||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const available = allAuthors.filter(a => !favAuthors.includes(a));
  
  if (available.length === 0) { toast('Все авторы из базы уже в избранном'); return; }
  
  const selectHtml = available.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
  const modalHtml = `
    <div class="modal-overlay open" id="authorSelectModal" onclick="if(event.target===this) this.remove()">
      <div class="modal" style="max-width:400px;">
        <div class="modal-header"><span>Выбрать автора</span><button onclick="document.getElementById('authorSelectModal').remove()">✕</button></div>
        <div class="modal-body">
          <select id="authorSelectInput">
            ${selectHtml}
          </select>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="document.getElementById('authorSelectModal').remove()">Отмена</button>
          <button class="btn primary" onclick="addSelectedAuthor()">Добавить</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', modalHtml);
};

window.addSelectedAuthor = function() {
  const select = document.getElementById('authorSelectInput');
  if (select && select.value) {
    toggleFavAuthor(select.value);
    document.getElementById('authorSelectModal').remove();
  }
};

window.toggleFavAuthor = function(author) {
  if (favAuthors.includes(author)) {
    favAuthors = favAuthors.filter(a => a !== author);
  } else {
    favAuthors.push(author);
  }
  saveFavAuthors();
  renderFavAuthors();
};

// --- АНАЛИТИКА ---
function renderAnalytics() {
  const yearCounts = {};
  books.forEach(b => {
    const d = parseDateInfo(b.readDate);
    if (d.year) yearCounts[d.year] = (yearCounts[d.year] || 0) + 1;
  });

  const years = Object.keys(yearCounts).map(Number).sort((a,b)=>a-b);
  const maxYearCount = Math.max(...Object.values(yearCounts), 1);
  
  const chartYears = document.getElementById('chartYears');
  if (years.length === 0) {
    chartYears.innerHTML = '<div style="color:var(--muted);font-size:13px;text-align:center;width:100%">Нет данных</div>';
  } else {
    chartYears.innerHTML = years.map(y => {
      const h = (yearCounts[y] / maxYearCount) * 100;
      return `
        <div class="bar-wrapper" onclick="showYearBooks(${y})">
          <div class="bar-val">${yearCounts[y]}</div>
          <div class="bar" style="height: ${h}%"></div>
          <div class="bar-label">${y}</div>
        </div>
      `;
    }).join('');
  }

  const select = document.getElementById('analyticsYearSelect');
  const currentSelected = select.value;
  
  select.innerHTML = years.sort((a,b)=>b-a).map(y => `<option value="${y}">${y} год</option>`).join('');
  
  const currentYear = new Date().getFullYear();
  if (years.includes(parseInt(currentSelected))) {
    select.value = currentSelected;
  } else if (years.includes(currentYear)) {
    select.value = currentYear;
  } else if (years.length > 0) {
    select.value = years[years.length - 1];
  }

  renderMonthChart();
}

function renderMonthChart() {
  const select = document.getElementById('analyticsYearSelect');
  const targetYear = parseInt(select.value);
  
  if (!targetYear) {
    document.getElementById('chartMonths').innerHTML = '';
    return;
  }

  const monthCounts = Array(12).fill(0);
  books.forEach(b => {
    const d = parseDateInfo(b.readDate);
    if (d.year === targetYear && d.month) {
      monthCounts[d.month - 1]++;
    }
  });

  const maxMonthCount = Math.max(...monthCounts, 1);
  const chartMonths = document.getElementById('chartMonths');
  
  chartMonths.innerHTML = monthCounts.map((count, i) => {
    const h = (count / maxMonthCount) * 100;
    return `
      <div class="bar-wrapper" onclick="showMonthBooks(${targetYear}, ${i + 1})">
        ${count > 0 ? `<div class="bar-val">${count}</div>` : ''}
        <div class="bar" style="height: ${h}%"></div>
        <div class="bar-label">${MONTH_NAMES[i+1].substring(0, 3)}</div>
      </div>
    `;
  }).join('');
}

document.getElementById('analyticsYearSelect').addEventListener('change', renderMonthChart);

window.showMonthBooks = function(year, month) {
  const targetBooks = books.filter(b => {
    const d = parseDateInfo(b.readDate);
    return d.year === year && d.month === month;
  });
  
  if (targetBooks.length === 0) return;

  document.getElementById('monthBooksTitle').textContent = `${MONTH_NAMES[month]} ${year} (${targetBooks.length})`;
  
  const listEl = document.getElementById('monthBooksList');
  let html = '<div class="node-list">';
  targetBooks.forEach((b, i) => {
    const coverHtml = b.cover ? `<img src="${escapeHtml(b.cover)}" class="node-cover" onerror="this.style.display='none'">` : '';
    const nodeClass = b.favorite ? 'node fav-book' : 'node';
    html += `
      <div class="${nodeClass}" onclick="closeModal('monthBooksModal'); openBookModal('${b.id}');">
        <div class="node-index">${i+1}.</div>
        ${coverHtml}
        <div class="node-body">
          <div class="node-name">${escapeHtml(b.title)}</div>
          <div class="node-author">${escapeHtml(b.author || 'Автор не указан')}</div>
          <div class="node-meta">${renderStarsHtml(b.rating)}</div>
        </div>
      </div>
    `;
  });
  html += '</div>';
  listEl.innerHTML = html;
  openModal('monthBooksModal');
};

window.showYearBooks = function(year) {
  const targetBooks = books.filter(b => {
    const d = parseDateInfo(b.readDate);
    return d.year === year;
  });
  
  if (targetBooks.length === 0) return;

  document.getElementById('monthBooksTitle').textContent = `${year} год (${targetBooks.length})`;
  
  const listEl = document.getElementById('monthBooksList');
  let html = '<div class="node-list">';
  targetBooks.forEach((b, i) => {
    const coverHtml = b.cover ? `<img src="${escapeHtml(b.cover)}" class="node-cover" onerror="this.style.display='none'">` : '';
    const nodeClass = b.favorite ? 'node fav-book' : 'node';
    html += `
      <div class="${nodeClass}" onclick="closeModal('monthBooksModal'); openBookModal('${b.id}');">
        <div class="node-index">${i+1}.</div>
        ${coverHtml}
        <div class="node-body">
          <div class="node-name">${escapeHtml(b.title)}</div>
          <div class="node-author">${escapeHtml(b.author || 'Автор не указан')}</div>
          <div class="node-meta">${renderStarsHtml(b.rating)}</div>
        </div>
      </div>
    `;
  });
  html += '</div>';
  listEl.innerHTML = html;
  openModal('monthBooksModal');
};

window.switchView = function(view) {
  currentView = view;
  document.getElementById('tabList').classList.toggle('active', view === 'list');
  document.getElementById('tabFav').classList.toggle('active', view === 'favorites');
  document.getElementById('tabAnalytics').classList.toggle('active', view === 'analytics');
  
  document.getElementById('viewList').style.display = view === 'list' ? 'block' : 'none';
  document.getElementById('viewFavorites').style.display = view === 'favorites' ? 'block' : 'none';
  document.getElementById('viewAnalytics').style.display = view === 'analytics' ? 'block' : 'none';
  
  document.getElementById('actionsBar').style.display = view === 'list' ? 'flex' : 'none';

  if (view === 'list') renderList();
  else if (view === 'favorites') switchFavTab(currentFavTab);
  else renderAnalytics();
};

// --- МОДАЛЬНЫЕ ОКНА ---
function openModal(id) { document.getElementById(id).classList.add('open'); }
window.closeModal = function(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('[data-close]').forEach(btn => btn.onclick = () => closeModal(btn.dataset.close));

const ratingRange = document.getElementById('ratingRange');
const ratingDisplay = document.getElementById('ratingDisplay');
ratingRange.addEventListener('input', (e) => {
  tempRating = parseFloat(e.target.value);
  ratingDisplay.textContent = tempRating > 0 ? tempRating + ' ★' : '0 ★';
});

document.getElementById('coverUploadBtn').onclick = () => document.getElementById('coverFileInput').click();
document.getElementById('coverFileInput').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const scale = 200 / img.width; 
      canvas.width = 200;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      tempCover = canvas.toDataURL('image/jpeg', 0.8);
      renderCoverPreview();
      document.getElementById('coverUrlInput').value = '';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
};
document.getElementById('coverClearBtn').onclick = () => {
  tempCover = '';
  document.getElementById('coverUrlInput').value = '';
  renderCoverPreview();
};
document.getElementById('coverUrlInput').addEventListener('input', (e) => {
  const v = e.target.value.trim();
  if (v) { tempCover = v; renderCoverPreview(); }
});
function renderCoverPreview() {
  const el = document.getElementById('coverPreview');
  if (tempCover) {
    el.innerHTML = `<img src="${escapeHtml(tempCover)}" onerror="this.parentNode.innerHTML='📷'">`;
  } else {
    el.innerHTML = '📷';
  }
}

window.openBookModal = function(id) {
  editingBookId = id;
  const modalTitle = document.getElementById('bookModalTitle');
  const delBtn = document.getElementById('deleteBookBtn');
  const favCheck = document.getElementById('bookFavCheck');
  
  if (id) {
    const b = books.find(x => x.id === id);
    if (!b) return;
    modalTitle.textContent = 'Редактировать книгу';
    document.getElementById('bookTitleInput').value = b.title || '';
    document.getElementById('bookAuthorInput').value = b.author || '';
    document.getElementById('bookDateInput').value = b.readDate || '';
    tempRating = b.rating || 0;
    tempCover = b.cover || '';
    document.getElementById('bookPublisherInput').value = b.publisher || '';
    document.getElementById('bookIsbnInput').value = b.isbn || '';
    document.getElementById('bookCountInput').value = b.readCount || 1;
    document.getElementById('bookAnnotationInput').value = b.annotation || '';
    favCheck.checked = !!b.favorite;
    
    if (tempCover && tempCover.startsWith('http')) {
      document.getElementById('coverUrlInput').value = tempCover;
    } else {
      document.getElementById('coverUrlInput').value = '';
    }
    
    delBtn.style.display = '';
    delBtn.onclick = () => {
      if (confirm('Удалить эту книгу?')) {
        books = books.filter(x => x.id !== id);
        save(); renderList(); updateHeaderStats(); closeModal('bookModal'); toast('Книга удалена');
      }
    };
  } else {
    modalTitle.textContent = 'Новая книга';
    document.getElementById('bookTitleInput').value = '';
    document.getElementById('bookAuthorInput').value = '';
    document.getElementById('bookDateInput').value = '';
    tempRating = 0;
    tempCover = '';
    document.getElementById('bookPublisherInput').value = '';
    document.getElementById('bookIsbnInput').value = '';
    document.getElementById('bookCountInput').value = 1;
    document.getElementById('bookAnnotationInput').value = '';
    document.getElementById('coverUrlInput').value = '';
    favCheck.checked = false;
    delBtn.style.display = 'none';
  }
  
  ratingRange.value = tempRating;
  ratingDisplay.textContent = tempRating > 0 ? tempRating + ' ★' : '0 ★';
  renderCoverPreview();
  openModal('bookModal');
};

document.getElementById('addBookBtn').onclick = () => openBookModal(null);

document.getElementById('saveBookBtn').onclick = () => {
  const title = document.getElementById('bookTitleInput').value.trim();
  if (!title) { toast('Введите название'); return; }
  
  const data = {
    title,
    author: document.getElementById('bookAuthorInput').value.trim(),
    readDate: document.getElementById('bookDateInput').value.trim(),
    rating: tempRating,
    cover: tempCover,
    favorite: document.getElementById('bookFavCheck').checked,
    publisher: document.getElementById('bookPublisherInput').value.trim(),
    isbn: document.getElementById('bookIsbnInput').value.trim(),
    readCount: parseInt(document.getElementById('bookCountInput').value, 10) || 0,
    annotation: document.getElementById('bookAnnotationInput').value.trim()
  };

  if (editingBookId) {
    const b = books.find(x => x.id === editingBookId);
    if (b) Object.assign(b, data);
  } else {
    books.unshift({ id: uid(), ...data, addedAt: Date.now() });
  }
  save(); renderList(); updateHeaderStats(); closeModal('bookModal'); toast('Сохранено');
};

// --- ЭКСПОРТ / ИМПОРТ ---
function download(filename, text) {
  const blob = new Blob([text], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

document.getElementById('footerTools').innerHTML = `
  <button class="btn" id="exportBtn" style="padding:8px 14px; font-size:13px">📤 Экспорт CSV</button>
  <button class="btn" id="importBtn" style="padding:8px 14px; font-size:13px">📥 Импорт CSV / JSON</button>
  <button class="btn danger" id="clearBtn" style="padding:8px 14px; font-size:13px">🗑 Очистить всё</button>
`;

document.getElementById('exportBtn').onclick = () => {
  if (!books.length) { toast('Нет книг'); return; }
  const header = ['Название','Автор','Дата прочтения','Моя оценка','ISBN','Издатель','Количество прочтений','Аннотация', 'Избранное', 'Обложка'];
  const escCsv = s => `"${String(s||'').replace(/"/g,'""')}"`;
  const lines = [header.join(';')];
  books.forEach(b => lines.push([escCsv(b.title), escCsv(b.author), escCsv(b.readDate), b.rating||0, escCsv(b.isbn), escCsv(b.publisher), b.readCount||0, escCsv(b.annotation), b.favorite ? '1' : '0', escCsv(b.cover)].join(';')));
  download(`polka-librium-${new Date().toISOString().slice(0,10)}.csv`, lines.join('\n'));
  toast('Экспортировано');
};

document.getElementById('clearBtn').onclick = () => {
  if (confirm('Удалить ВСЕ книги? Сначала сделайте экспорт!')) {
    books = []; favAuthors = []; save(); saveFavAuthors(); renderList(); updateHeaderStats(); toast('Всё очищено');
  }
};

document.getElementById('importBtn').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = (e) => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const text = ev.target.result;
    if (file.name.endsWith('.json')) {
      try {
        const data = JSON.parse(text);
        if (Array.isArray(data)) { 
            books = data.map(b => ({...b, id: uid(), favorite: !!b.favorite, cover: b.cover || ''})); 
            save(); renderList(); updateHeaderStats(); toast(`JSON загружен (${books.length} кн.)`); 
        }
      } catch(err) { toast('Ошибка JSON'); }
    } else {
      const firstLine = text.split('\n')[0];
      const delim = (firstLine.match(/;/g)||[]).length > (firstLine.match(/,/g)||[]).length ? ';' : ',';
      const rows = []; let row = [], cur = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQ) {
          if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
          else cur += c;
        } else {
          if (c === '"') inQ = true;
          else if (c === delim) { row.push(cur); cur = ''; }
          else if (c === '\n' || c === '\r') { if (cur || row.length) { row.push(cur); rows.push(row); row = []; cur = ''; } }
          else cur += c;
        }
      }
      if (cur || row.length) { row.push(cur); rows.push(row); }
      
      if (rows.length > 1) {
        const header = rows[0].map(h => h.trim().toLowerCase());
        const idx = {
          title: header.findIndex(h => h.includes('назван')),
          author: header.findIndex(h => h.includes('автор')),
          date: header.findIndex(h => h.includes('дата')),
          rating: header.findIndex(h => h.includes('оценк')),
          isbn: header.findIndex(h => h.includes('isbn')),
          pub: header.findIndex(h => h.includes('издатель')),
          count: header.findIndex(h => h.includes('прочтени')),
          ann: header.findIndex(h => h.includes('аннотац')),
          fav: header.findIndex(h => h.includes('избранн')),
          cover: header.findIndex(h => h.includes('обложк'))
        };
        const newBooks = [];
        for (let i = 1; i < rows.length; i++) {
          const cells = rows[i];
          if (idx.title < 0 || !cells[idx.title]) continue;
          newBooks.push({
            id: uid(),
            title: cells[idx.title] || '',
            author: idx.author >= 0 ? cells[idx.author] : '',
            readDate: idx.date >= 0 ? cells[idx.date] : '',
            rating: idx.rating >= 0 ? (parseFloat(String(cells[idx.rating]).replace(',','.')) || 0) : 0,
            isbn: idx.isbn >= 0 ? cells[idx.isbn] : '',
            publisher: idx.pub >= 0 ? cells[idx.pub] : '',
            readCount: idx.count >= 0 ? (parseInt(cells[idx.count]) || 0) : 0,
            annotation: idx.ann >= 0 ? cells[idx.ann] : '',
            favorite: idx.fav >= 0 ? (cells[idx.fav] === '1') : false,
            cover: idx.cover >= 0 ? cells[idx.cover] : '',
            addedAt: Date.now()
          });
        }
        
        const yearsInFile = newBooks.map(b => parseDateInfo(b.readDate).year).filter(y => y > 0);
        const minY = yearsInFile.length ? Math.min(...yearsInFile) : 0;
        const maxY = yearsInFile.length ? Math.max(...yearsInFile) : 0;
        const yearsMsg = minY ? ` (годы: ${minY}-${maxY})` : '';

        if (books.length > 0) {
          if (confirm(`Найдено ${newBooks.length} книг${yearsMsg}. Добавить к текущим? (Отмена = Заменить всё)`)) {
            books = books.concat(newBooks);
          } else {
            books = newBooks;
          }
        } else {
          books = newBooks;
        }
        save(); renderList(); updateHeaderStats(); toast(`Загружено ${newBooks.length} книг${yearsMsg}`);
      }
    }
    e.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
};

// Инициализация
load();
applyTheme(localStorage.getItem(THEME_KEY) || 'light');
applyThemeSettings();
updateClock();
updateHeaderStats();
renderList();
updateStorageBadge();

})();
</script>
