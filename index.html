<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Polka Librium">
<title>Polka Librium</title>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--accent:#6366f1;--border:#e2e8f0;--star:#f59e0b;--danger:#ef4444}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--accent:#818cf8;--border:#334155;--star:#fbbf24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:100px;overflow-wrap:break-word}
header{position:sticky;top:0;z-index:100;background:var(--bg);padding:10px 14px;border-bottom:1px solid var(--border)}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.02em}
.icon-btn{background:transparent;border:none;color:var(--muted);font-size:22px;padding:4px 10px;cursor:pointer;line-height:1;border-radius:8px}
.icon-btn:active{background:var(--border)}
.search-row{margin-bottom:6px}
input[type="search"],input[type="text"],input[type="number"],textarea,select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font-size:15px;outline:none;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.filters{display:flex;gap:6px;margin-top:6px}
.filters select{flex:1;font-size:13px;padding:6px 8px}
.count{font-size:12px;color:var(--muted);margin-top:6px}
main{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer}
.card:active{background:var(--bg)}
.card-title{font-weight:600;font-size:15px;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-author{color:var(--muted);font-size:13px;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.rating-badge{color:var(--star);font-weight:600}
.fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:30px;line-height:1;cursor:pointer;box-shadow:0 4px 20px rgba(99,102,241,.45);z-index:99;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.95)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:200;overflow-y:auto;padding:16px;align-items:flex-start;justify-content:center}
.modal.visible{display:flex}
.modal-content{background:var(--card);border-radius:16px;width:100%;max-width:560px;padding:20px;position:relative;margin-top:10px;margin-bottom:10px}
.modal-close{position:absolute;top:10px;right:10px;background:transparent;border:none;font-size:24px;color:var(--muted);cursor:pointer;padding:4px 12px;line-height:1}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.field textarea{min-height:120px;resize:vertical;font-size:14px}
.field input[type="range"]{width:100%;padding:0}
.range-row{display:flex;align-items:center;gap:10px}
.range-row output{min-width:40px;text-align:right;color:var(--star);font-weight:600;font-size:15px}
.btn-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{padding:11px 16px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;flex:1;min-width:100px;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-danger{background:var(--danger);color:#fff}
.btn:active{opacity:.85}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-state h2{color:var(--text);font-size:18px;margin:0 0 8px}
.empty-state p{font-size:14px;margin:0}
.detail-title{margin:0 0 4px;font-size:19px;line-height:1.3;padding-right:30px}
.detail-author{color:var(--muted);margin-bottom:14px;font-size:14px}
.detail-annotation{margin-top:16px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.detail-grid{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:13px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.detail-grid dt{color:var(--muted)}
.detail-grid dd{margin:0}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-item{display:block;width:100%;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--text);font-size:14px;text-align:left;cursor:pointer;font-family:inherit}
.menu-item:active{background:var(--border)}
.menu-item.danger{color:var(--danger)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>📚 Polka Librium</h1>
    <button class="icon-btn" id="menu-btn" aria-label="Меню">⋯</button>
  </div>
  <div class="search-row"><input type="search" id="search" placeholder="Поиск по названию или автору..."></div>
  <div class="filters">
    <select id="filter-rating">
      <option value="all">Все оценки</option>
      <option value="5">5 ★</option>
      <option value="4">4+ ★</option>
      <option value="3">3+ ★</option>
      <option value="1">С оценкой</option>
      <option value="unrated">Без оценки</option>
    </select>
    <select id="sort">
      <option value="date-desc">Сначала новые</option>
      <option value="date-asc">Сначала старые</option>
      <option value="rating-desc">Оценка ↓</option>
      <option value="rating-asc">Оценка ↑</option>
      <option value="title-asc">По названию</option>
      <option value="author-asc">По автору</option>
    </select>
  </div>
  <div class="count" id="count"></div>
</header>
<main id="list"></main>
<button class="fab" id="add-btn" aria-label="Добавить книгу">+</button>
<div class="modal" id="modal"><div class="modal-content" id="modal-content"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept=".csv,.json,text/csv,application/json" hidden>

<script>
(function(){
'use strict';
const STORAGE_KEY='polka_librium_v1';
let books=[];
const state={search:'',filterRating:'all',sort:'date-desc'};

function load(){try{const raw=localStorage.getItem(STORAGE_KEY);books=raw?JSON.parse(raw):[];if(!Array.isArray(books))books=[];}catch(e){books=[];}}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(books));}catch(e){toast('⚠️ Не удалось сохранить. Экспортируйте данные.');}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2400);}

const MONTHS={'январь':1,'января':1,'февраль':2,'февраля':2,'март':3,'марта':3,'апрель':4,'апреля':4,'май':5,'мая':5,'июнь':6,'июня':6,'июль':7,'июля':7,'август':8,'августа':8,'сентябрь':9,'сентября':9,'октябрь':10,'октября':10,'ноябрь':11,'ноября':11,'декабрь':12,'декабря':12};
function parseDate(str){if(!str)return 0;const s=String(str).toLowerCase();let m=0;for(const k of Object.keys(MONTHS)){if(s.includes(k)){m=MONTHS[k];break;}}const ym=s.match(/(\d{4})/);const y=ym?parseInt(ym[1],10):0;return y*10000+m*100+15;}
function plural(n,one,few,many){const a=n%10,b=n%100;if(a===1&&b!==11)return one;if(a>=2&&a<=4&&(b<10||b>=20))return few;return many;}

function getFiltered(){
  let list=books.slice();
  const q=state.search.trim().toLowerCase();
  if(q)list=list.filter(b=>(b.title||'').toLowerCase().includes(q)||(b.author||'').toLowerCase().includes(q));
  if(state.filterRating==='unrated')list=list.filter(b=>!b.rating||b.rating===0);
  else if(state.filterRating!=='all'){const min=parseInt(state.filterRating,10);list=list.filter(b=>(b.rating||0)>=min);}
  switch(state.sort){
    case 'date-desc':list.sort((a,b)=>parseDate(b.readDate)-parseDate(a.readDate));break;
    case 'date-asc':list.sort((a,b)=>parseDate(a.readDate)-parseDate(b.readDate));break;
    case 'rating-desc':list.sort((a,b)=>(b.rating||0)-(a.rating||0));break;
    case 'rating-asc':list.sort((a,b)=>(a.rating||0)-(b.rating||0));break;
    case 'title-asc':list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','ru'));break;
    case 'author-asc':list.sort((a,b)=>(a.author||'').localeCompare(b.author||'','ru'));break;
  }
  return list;
}

function render(){
  const list=getFiltered();
  const main=document.getElementById('list');
  const cnt=document.getElementById('count');
  cnt.textContent=list.length===books.length
    ?`${books.length} ${plural(books.length,'книга','книги','книг')}`
    :`${list.length} из ${books.length}`;
  if(list.length===0){
    main.innerHTML=books.length===0
      ?'<div class="empty-state"><h2>Полка пуста</h2><p>Нажмите «+» или импортируйте CSV через меню «⋯»</p></div>'
      :'<div class="empty-state"><h2>Ничего не найдено</h2><p>Измените поиск или фильтры</p></div>';
    return;
  }
  main.innerHTML=list.map(b=>{
    const r=parseFloat(b.rating)||0;
    const rs=r>0?`<span class="rating-badge">${r.toFixed(1)} ★</span>`:'<span>—</span>';
    return `<div class="card" data-id="${b.id}">
      <div class="card-title">${esc(b.title)}</div>
      <div class="card-author">${esc(b.author||'Автор не указан')}</div>
      <div class="card-meta"><span>${esc(b.readDate||'—')}</span>${rs}</div>
    </div>`;
  }).join('');
  main.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>openDetail(el.dataset.id)));
}

function openModal(html){document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').classList.add('visible');document.body.style.overflow='hidden';}
function closeModal(){document.getElementById('modal').classList.remove('visible');document.body.style.overflow='';}
window.closeModal=closeModal;
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

function openDetail(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  const r=parseFloat(b.rating)||0;
  const rating=r>0?`<span style="color:var(--star);font-weight:600">${r.toFixed(1)} ★</span>`:'—';
  const details=[
    b.readDate&&`<dt>Дата</dt><dd>${esc(b.readDate)}</dd>`,
    `<dt>Оценка</dt><dd>${rating}</dd>`,
    b.publisher&&`<dt>Издатель</dt><dd>${esc(b.publisher)}</dd>`,
    b.isbn&&`<dt>ISBN</dt><dd>${esc(b.isbn)}</dd>`,
    b.readCount>0&&`<dt>Прочтений</dt><dd>${esc(b.readCount)}</dd>`,
  ].filter(Boolean).join('');
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 class="detail-title">${esc(b.title)}</h2>
    <div class="detail-author">${esc(b.author||'Автор не указан')}</div>
    ${details?`<dl class="detail-grid">${details}</dl>`:''}
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-edit">✏️ Редактировать</button>
      <button class="btn btn-danger" id="btn-del">🗑 Удалить</button>
    </div>
    ${b.annotation?`<div class="detail-annotation">${esc(b.annotation)}</div>`:''}
  `);
  document.getElementById('btn-edit').onclick=()=>openEditor(id);
  document.getElementById('btn-del').onclick=()=>{
    if(confirm(`Удалить книгу «${b.title}»?`)){books=books.filter(x=>x.id!==id);save();closeModal();render();toast('Удалено');}
  };
}

function openEditor(id){
  const editing=!!id;
  const b=editing?books.find(x=>x.id===id):{title:'',author:'',readDate:currentMonthStr(),rating:0,isbn:'',publisher:'',readCount:0,annotation:''};
  if(editing&&!b)return;
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 style="margin:0 0 16px;font-size:18px">${editing?'Редактировать книгу':'Новая книга'}</h2>
    <form id="book-form">
      <div class="field"><label>Название *</label><input type="text" name="title" required value="${esc(b.title)}"></div>
      <div class="field"><label>Автор</label><input type="text" name="author" value="${esc(b.author)}"></div>
      <div class="field"><label>Дата прочтения</label><input type="text" name="readDate" value="${esc(b.readDate)}" placeholder="Ноябрь 2026 г."></div>
      <div class="field"><label>Моя оценка</label>
        <div class="range-row">
          <input type="range" name="rating" min="0" max="5" step="0.5" value="${b.rating||0}" id="rating-input">
          <output id="rating-out">${(b.rating||0).toFixed(1)}</output>
        </div>
      </div>
      <div class="field"><label>Издатель</label><input type="text" name="publisher" value="${esc(b.publisher)}"></div>
      <div class="field"><label>ISBN</label><input type="text" name="isbn" value="${esc(b.isbn)}"></div>
      <div class="field"><label>Сколько раз прочитано</label><input type="number" name="readCount" min="0" value="${b.readCount||0}"></div>
      <div class="field"><label>Аннотация</label><textarea name="annotation">${esc(b.annotation)}</textarea></div>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" id="cancel-btn">Отмена</button>
        <button type="submit" class="btn btn-primary">${editing?'Сохранить':'Добавить'}</button>
      </div>
    </form>
  `);
  const form=document.getElementById('book-form');
  const ri=document.getElementById('rating-input');
  const ro=document.getElementById('rating-out');
  ri.addEventListener('input',()=>ro.textContent=parseFloat(ri.value).toFixed(1));
  document.getElementById('cancel-btn').onclick=()=>editing?openDetail(id):closeModal();
  form.addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(form);
    const data={
      title:(fd.get('title')||'').trim(),
      author:(fd.get('author')||'').trim(),
      readDate:(fd.get('readDate')||'').trim(),
      rating:parseFloat(fd.get('rating'))||0,
      publisher:(fd.get('publisher')||'').trim(),
      isbn:(fd.get('isbn')||'').trim(),
      readCount:parseInt(fd.get('readCount'),10)||0,
      annotation:(fd.get('annotation')||'').trim(),
    };
    if(!data.title){toast('Название обязательно');return;}
    if(editing)Object.assign(b,data);
    else books.unshift({id:uid(),...data,addedAt:Date.now()});
    save();render();closeModal();toast(editing?'Сохранено':'Книга добавлена');
  });
}

function currentMonthStr(){const d=new Date();const m=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];return `${m[d.getMonth()]} ${d.getFullYear()} г.`;}

function openMenu(){
  openModal(`
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 style="margin:0 0 16px;font-size:18px">Меню</h2>
    <div class="menu-list">
      <button class="menu-item" id="m-import">📥 Импорт CSV / JSON</button>
      <button class="menu-item" id="m-export-csv">📤 Экспорт в CSV</button>
      <button class="menu-item" id="m-export-json">📤 Экспорт в JSON</button>
      <button class="menu-item danger" id="m-clear">🗑 Очистить всё (${books.length})</button>
      <button class="menu-item" id="m-about">ℹ️ О приложении</button>
    </div>
  `);
  document.getElementById('m-import').onclick=()=>{closeModal();document.getElementById('file-input').click();};
  document.getElementById('m-export-csv').onclick=exportCSV;
  document.getElementById('m-export-json').onclick=exportJSON;
  document.getElementById('m-clear').onclick=()=>{
    if(!books.length){toast('И так пусто');return;}
    if(confirm(`Удалить все ${books.length} книг? Рекомендую сначала сделать экспорт.`)){
      if(confirm('Точно удалить ВСЁ? Восстановить не получится.')){
        books=[];save();render();closeModal();toast('Всё очищено');
      }
    }
  };
  document.getElementById('m-about').onclick=()=>{
    openModal(`
      <button class="modal-close" onclick="closeModal()">×</button>
      <h2 style="margin:0 0 12px;font-size:18px">📚 Polka Librium</h2>
      <p style="font-size:14px;line-height:1.6;color:var(--muted)">Лёгкое приложение для учёта прочитанных книг. Все данные хранятся только на вашем устройстве — без рекламы и серверов.</p>
      <p style="font-size:14px;line-height:1.6;color:var(--muted);margin-top:12px">Книг в базе: <strong>${books.length}</strong></p>
      <p style="font-size:12px;color:var(--muted);margin-top:16px">Версия 1.0</p>
    `);
  };
}

document.getElementById('file-input').addEventListener('change',e=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const text=ev.target.result;
      const ext=file.name.toLowerCase();
      const imported=ext.endsWith('.json')?parseJSONImport(text):parseCSV(text);
      if(!imported.length){toast('Книги в файле не найдены');e.target.value='';return;}
      applyImport(imported);
    }catch(err){console.error(err);toast('Ошибка чтения файла');}
    e.target.value='';
  };
  reader.readAsText(file,'UTF-8');
});

function parseJSONImport(text){
  const data=JSON.parse(text);if(!Array.isArray(data))throw new Error('not array');
  return data.map(it=>({
    id:uid(),
    title:String(it.title||it['Название']||'').trim(),
    author:String(it.author||it['Автор']||'').trim(),
    readDate:String(it.readDate||it['Дата прочтения']||'').trim(),
    rating:parseFloat(it.rating||it['Моя оценка'])||0,
    isbn:String(it.isbn||it['ISBN']||'').trim(),
    publisher:String(it.publisher||it['Издатель']||'').trim(),
    readCount:parseInt(it.readCount||it['Количество прочтений'],10)||0,
    annotation:String(it.annotation||it['Аннотация']||'').trim(),
    addedAt:Date.now(),
  })).filter(b=>b.title);
}

function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const firstLine=text.split('\n')[0]||'';
  const semis=(firstLine.match(/;/g)||[]).length;
  const commas=(firstLine.match(/,/g)||[]).length;
  const delim=semis>=commas?';':',';
  const rows=[];let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===delim){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(c==='\r'){}
      else cur+=c;
    }
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  if(rows.length<2)return[];
  const header=rows[0].map(h=>h.trim().toLowerCase());
  const idx={
    title:header.findIndex(h=>/назван/.test(h)),
    author:header.findIndex(h=>/автор/.test(h)),
    readDate:header.findIndex(h=>/дата/.test(h)),
    rating:header.findIndex(h=>/оценк/.test(h)),
    isbn:header.findIndex(h=>/isbn/.test(h)),
    publisher:header.findIndex(h=>/издатель/.test(h)),
    readCount:header.findIndex(h=>/прочтени/.test(h)),
    annotation:header.findIndex(h=>/аннотац/.test(h)),
  };
  if(idx.title<0)return[];
  const expected=header.length;
  const result=[];
  for(let i=1;i<rows.length;i++){
    let cells=rows[i].slice();
    if(cells.length>expected){const extra=cells.splice(expected-1);cells.push(extra.join(delim));}
    const get=k=>idx[k]>=0?(cells[idx[k]]||'').trim():'';
    const title=get('title');if(!title)continue;
    const ratingRaw=get('rating').replace(',','.');
    result.push({
      id:uid(),
      title,
      author:get('author'),
      readDate:get('readDate'),
      rating:parseFloat(ratingRaw)||0,
      isbn:get('isbn'),
      publisher:get('publisher'),
      readCount:parseInt(get('readCount'),10)||0,
      annotation:get('annotation'),
      addedAt:Date.now()-(rows.length-i)*1000,
    });
  }
  return result;
}

function applyImport(imported){
  if(!books.length){books=imported;save();render();closeModal();toast(`Загружено ${imported.length} книг`);return;}
  const addMode=confirm(`Найдено ${imported.length} книг.\n\nОК — ДОБАВИТЬ к текущим (${books.length}).\nОтмена — ЗАМЕНИТЬ всё импортом.`);
  if(addMode){
    const seen=new Set(books.map(b=>`${(b.title||'').toLowerCase()}|${(b.author||'').toLowerCase()}`));
    let added=0;
    for(const b of imported){
      const key=`${b.title.toLowerCase()}|${b.author.toLowerCase()}`;
      if(!seen.has(key)){books.push(b);seen.add(key);added++;}
    }
    save();render();closeModal();toast(`Добавлено ${added} новых книг`);
  }else{
    if(confirm('Заменить ВСЕ текущие данные импортом?')){
      books=imported;save();render();closeModal();toast(`Загружено ${imported.length} книг`);
    }
  }
}

function download(filename,text,mime){
  const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
}
function csvEscape(v){const s=String(v==null?'':v);if(/[;"\n\r]/.test(s))return '"'+s.replace(/"/g,'""')+'"';return s;}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function exportCSV(){
  if(!books.length){toast('Нет данных для экспорта');return;}
  const header=['Название','Автор','Дата прочтения','Моя оценка','ISBN','Издатель','Количество прочтений','Аннотация'];
  const lines=[header.join(';')];
  for(const b of books){lines.push([csvEscape(b.title),csvEscape(b.author),csvEscape(b.readDate),b.rating||0,csvEscape(b.isbn),csvEscape(b.publisher),b.readCount||0,csvEscape(b.annotation)].join(';'));}
  download(`polka-librium-${today()}.csv`,lines.join('\n'),'text/csv;charset=utf-8');
  closeModal();toast('CSV экспортирован');
}
function exportJSON(){
  if(!books.length){toast('Нет данных для экспорта');return;}
  download(`polka-librium-${today()}.json`,JSON.stringify(books,null,2),'application/json');
  closeModal();toast('JSON экспортирован');
}

document.getElementById('search').addEventListener('input',e=>{state.search=e.target.value;render();});
document.getElementById('filter-rating').addEventListener('change',e=>{state.filterRating=e.target.value;render();});
document.getElementById('sort').addEventListener('change',e=>{state.sort=e.target.value;render();});
document.getElementById('add-btn').addEventListener('click',()=>openEditor(null));
document.getElementById('menu-btn').addEventListener('click',openMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

load();render();
if(!books.length)setTimeout(()=>toast('Загрузите CSV: «⋯» → Импорт'),600);
})();
</script>
